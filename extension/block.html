<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked by SafeHarbor</title>
  <link rel="stylesheet" href="block.css">
</head>
<body>
  <main>
    <section>
      <p class="eyebrow">SafeHarbor</p>
      <h1>Page blocked</h1>
      <dl>
        <div>
          <dt>Reason</dt>
          <dd id="reason"></dd>
        </div>
        <div>
          <dt>URL</dt>
          <dd id="url"></dd>
        </div>
        <div>
          <dt>Time</dt>
          <dd id="timestamp"></dd>
        </div>
        <div>
          <dt>Rule</dt>
          <dd id="ruleId"></dd>
        </div>
      </dl>
      <div class="actions">
        <button id="back" type="button">Back</button>
        <button id="status" type="button">Status</button>
      </div>
    </section>
  </main>
  <script src="block.js"></script>
</body>
</html>
